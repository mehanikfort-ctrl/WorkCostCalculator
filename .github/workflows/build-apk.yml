name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unpack project
        run: |
          unzip -q WorkCostCalculator_Android_v1_4_phone_build_fixed.zip

      - name: Copy source files to project
        run: |
          cp WorkData.kt buildv14/app/src/main/java/com/example/workcost/WorkData.kt
          cp Estimate.kt buildv14/app/src/main/java/com/example/workcost/Estimate.kt
          cp MainMenuScreen.kt buildv14/app/src/main/java/com/example/workcost/MainMenuScreen.kt
          cp CreateEstimateScreen.kt buildv14/app/src/main/java/com/example/workcost/CreateEstimateScreen.kt
          cp WorksScreen.kt buildv14/app/src/main/java/com/example/workcost/WorksScreen.kt
          cp EstimatesListScreen.kt buildv14/app/src/main/java/com/example/workcost/EstimatesListScreen.kt
          cp EstimateStorage.kt buildv14/app/src/main/java/com/example/workcost/EstimateStorage.kt
          cp PriceStorage.kt buildv14/app/src/main/java/com/example/workcost/PriceStorage.kt
          cp SettingsScreen.kt buildv14/app/src/main/java/com/example/workcost/SettingsScreen.kt
          cp CustomWork.kt buildv14/app/src/main/java/com/example/workcost/CustomWork.kt
          cp CustomWorkStorage.kt buildv14/app/src/main/java/com/example/workcost/CustomWorkStorage.kt
          cp ManageWorksScreen.kt buildv14/app/src/main/java/com/example/workcost/ManageWorksScreen.kt
          cp Theme.kt buildv14/app/src/main/java/com/example/workcost/Theme.kt
          cp PdfExporter.kt buildv14/app/src/main/java/com/example/workcost/PdfExporter.kt
          cp EstimateImporter.kt buildv14/app/src/main/java/com/example/workcost/EstimateImporter.kt
          cp MainActivity.kt buildv14/app/src/main/java/com/example/workcost/MainActivity.kt

      - name: Update AndroidManifest.xml
        run: |
          cd buildv14
          sed -i 's|</application>|<provider\n            android:name="androidx.core.content.FileProvider"\n            android:authorities="${applicationId}.fileprovider"\n            android:exported="false"\n            android:grantUriPermissions="true">\n            <meta-data\n                android:name="android.support.FILE_PROVIDER_PATHS"\n                android:resource="@xml/file_paths" />\n        </provider>\n    </application>|' app/src/main/AndroidManifest.xml

      - name: Create file_paths.xml
        run: |
          cd buildv14
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
          </paths>
          EOF
      - name: Generate app icons from logo
        run: |
          cd buildv14
          pip install Pillow
          python3 << 'EOF'
          from PIL import Image
          import os
      - name: Copy logo to drawable
        run: |
          cd buildv14
          mkdir -p app/src/main/res/drawable
          cp ../b342691e-908f-4f78-a4af-5788cef786ff.png app/src/main/res/drawable/logo.png

          # Загружаем логотип из корня репозитория
          logo_path = '../b342691e-908f-4f78-a4af-5788cef786ff.png'
          img = Image.open(logo_path).convert("RGBA")

          # Размеры для разных плотностей
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          for folder, size in sizes.items():
              target_dir = f'app/src/main/res/{folder}'
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((size, size), Image.LANCZOS)
              resized.save(f'{target_dir}/ic_launcher.png', 'PNG')
              resized.save(f'{target_dir}/ic_launcher_round.png', 'PNG')

          print('Icons generated successfully')
          EOF

      - name: Fix Gradle properties
        run: |
          cd buildv14
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Add Icons dependency
        run: |
          cd buildv14
          python3 -c "
          import re
          path = 'app/build.gradle.kts'
          with open(path, 'r') as f:
              content = f.read()
          if 'material-icons-extended' not in content:
              content = content.replace('dependencies {', 'dependencies {\n    implementation(\"androidx.compose.material:material-icons-extended:1.5.4\")', 1)
              with open(path, 'w') as f:
                  f.write(content)
          print('Icons dependency added')
          "

      - name: Build APK
        run: |
          cd buildv14
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkCostCalculator-debug
          path: buildv14/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
