name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Show files
        run: |
          pwd
          find . -maxdepth 3 -type f | head -100

      - name: Unpack project
        run: |
          unzip -q WorkCostCalculator_Android_v1_4_phone_build_fixed.zip
          find . -maxdepth 3 -type f | head -100

      - name: Show MainActivity
        run: |
          echo "===== MAINACTIVITY.KT ====="
          cat buildv14/app/src/main/java/com/example/workcost/MainActivity.kt
          echo "===== END MAINACTIVITY.KT ====="

      - name: Fix Gradle properties
        run: |
          cd buildv14
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
      - name: Fix MainActivity.kt
        run: |
          cd buildv14/app/src/main/java/com/example/workcost
          
          # 1. Возвращаем правильное имя переменной в списке формул (строка 37)
          sed -i 's/expression="Q"/expr="Q"/g' MainActivity.kt
          sed -i 's/expression="L x W"/expr="L x W"/g' MainActivity.kt
          sed -i 's/expression="L x W x H"/expr="L x W x H"/g' MainActivity.kt
          sed -i 's/expression="Q x P"/expr="Q x P"/g' MainActivity.kt
                    # 3. Исправляем ошибки с Modifier в строках 56-59
          # Убираем лишние фигурные скобки, если они есть
          sed -i 's/Modifier\.padding(\([0-9]*\)\.dp){/Modifier.padding(\1.dp)/g' MainActivity.kt
          sed -i 's/Modifier\.padding(\([0-9]*\)\.dp) {/Modifier.padding(\1.dp)/g' MainActivity.kt
          
          # 4. Показываем строки 50-65 для проверки
          echo "=== LINES 50-65 ==="
          sed -n '50,65p' MainActivity.kt
          echo "=== END LINES ==="
          
          # 2. Исправляем ошибку с Modifier в строках 56-59 (добавляем .padding)
          # (Здесь мы просто показываем, что менять, но пока оставим как есть, чтобы не сломать)
          
          echo "=== ИСПРАВЛЕННЫЙ ФАЙЛ ==="
          cat MainActivity.kt
      - name: Build APK
        run: |
          cd buildv14
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkCostCalculator-debug
          path: buildv14/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
