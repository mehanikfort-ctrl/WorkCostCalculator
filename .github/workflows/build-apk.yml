name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Show files
        run: |
          pwd
          find . -maxdepth 3 -type f | head -100

      - name: Unpack project
        run: |
          unzip -q WorkCostCalculator_Android_v1_4_phone_build_fixed.zip
          find . -maxdepth 3 -type f | head -100

      - name: Show MainActivity
        run: |
          echo "===== MAINACTIVITY.KT ====="
          cat buildv14/app/src/main/java/com/example/workcost/MainActivity.kt
          echo "===== END MAINACTIVITY.KT ====="

      - name: Fix Gradle properties
        run: |
          cd buildv14
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
      - name: Fix expr typo
        run: |
           cd buildv14
           sed -i 's/\bexpr\b/expression/g' app/src/main/java/com/example/workcost/MainActivity.kt
      - name: Show lines 30 to 65
        run: |
          echo "===== LINES 30-65 ====="
          sed -n '30,65p' buildv14/app/src/main/java/com/example/workcost/MainActivity.kt
      - name: Build APK
        run: |
          cd buildv14
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkCostCalculator-debug
          path: buildv14/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
