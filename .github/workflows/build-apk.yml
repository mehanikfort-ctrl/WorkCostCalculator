name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unpack project
        run: |
          unzip -q WorkCostCalculator_Android_v1_4_phone_build.zip
          cp gradle.properties buildv14/gradle.properties

      - name: Fix JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildv14/app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions {" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
                  1
              )

          if "compilerOptions.jvmTarget" not in s:
              s += """

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
          }
          """

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd buildv14
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkCostCalculator-debug
          path: buildv14/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
