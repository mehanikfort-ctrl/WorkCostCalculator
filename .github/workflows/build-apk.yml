name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unpack project
        run: |
          unzip -q WorkCostCalculator_Android_v1_4_phone_build_fixed.zip

      - name: Copy WorkData.kt to project
        run: |
          cp WorkData.kt buildv14/app/src/main/java/com/example/workcost/WorkData.kt
          cp MainActivity.kt buildv14/app/src/main/java/com/example/workcost/MainActivity.kt

      - name: Fix Gradle properties
        run: |
          cd buildv14
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Build APK
        run: |
          cd buildv14
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkCostCalculator-debug
          path: buildv14/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
