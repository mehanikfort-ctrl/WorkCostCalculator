name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unpack project
        run: |
          unzip -q WorkCostCalculator_Android_v1_4_phone_build_fixed.zip

      - name: Fix Gradle properties
        run: |
          cd buildv14
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties

      - name: Fix MainActivity.kt
        run: |
          cd buildv14/app/src/main/java/com/example/workcost
          
          # 1. Удаляем проблемные строки 56-59
          sed -i '56s/.*//' MainActivity.kt
          sed -i '57s/.*//' MainActivity.kt
          sed -i '58s/.*//' MainActivity.kt
          sed -i '59s/.*//' MainActivity.kt
          
          # 2. Исправляем ошибку 'expr' в строке 37
          # Заменяем эту строку на создание пустого списка формул
          sed -i '37s|.*|val formulas = emptyList<FormulaEntity>()|' MainActivity.kt
          
          echo "=== ИСПРАВЛЕННЫЙ ФАЙЛ (строки 30-65) ==="
          sed -n '30,65p' MainActivity.kt
          echo "=== END ==="

      - name: Build APK
        run: |
          cd buildv14
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkCostCalculator-debug
          path: buildv14/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
