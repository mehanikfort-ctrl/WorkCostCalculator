name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Show files
        run: |
          pwd
          find . -maxdepth 3 -type f | head -100

      - name: Unpack project
        run: |
          unzip -q WorkCostCalculator_Android_v1_4_phone_build_fixed.zip
          find . -maxdepth 3 -type f | head -100

      - name: Show MainActivity
        run: |
          echo "===== MAINACTIVITY.KT ====="
          cat buildv14/app/src/main/java/com/example/workcost/MainActivity.kt
          echo "===== END MAINACTIVITY.KT ====="

      - name: Fix Gradle properties
        run: |
          cd buildv14
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties

      - name: Fix MainActivity.kt
        run: |
          cd buildv14/app/src/main/java/com/example/workcost
          
      - name: Fix MainActivity.kt
        run: |
          cd buildv14/app/src/main/java/com/example/workcost
          
          # 1. Принудительно заменяем все проблемные места на простой текст
          # Заменяем строку 37 на простой список без формул (чтобы не было ошибок)
          sed -i '37s/.*/val formulas = emptyList<FormulaEntity>()/' MainActivity.kt
          
          # 2. Заменяем проблемные строки 56-59 на простой текст
          # (вместо сложных Modifier.padding...)
          sed -i '56s/.*/Text("Заглушка 1")/' MainActivity.kt
          sed -i '57s/.*/Text("Заглушка 2")/' MainActivity.kt
          sed -i '58s/.*/Text("Заглушка 3")/' MainActivity.kt
          sed -i '59s/.*/Text("Заглушка 4")/' MainActivity.kt
          
          echo "=== ИСПРАВЛЕННЫЕ СТРОКИ ==="
          sed -n '35,60p' MainActivity.kt
          echo "=== END ==="
          
          # 3. Сохраняем исправленный файл для скачивания
          cp MainActivity.kt $GITHUB_WORKSPACE/MainActivity_fixed.kt

      - name: Build APK
        run: |
          cd buildv14
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkCostCalculator-debug
          path: buildv14/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload fixed MainActivity
        uses: actions/upload-artifact@v4
        with:
          name: fixed-MainActivity
          path: MainActivity_fixed.kt
          if-no-files-found: warn
