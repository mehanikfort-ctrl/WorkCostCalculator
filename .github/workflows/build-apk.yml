name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Show files
        run: |
          pwd
          find . -maxdepth 3 -type f | head -100

      - name: Unpack project
        run: |
          unzip -q WorkCostCalculator_Android_v1_4_phone_build_fixed.zip
          find . -maxdepth 3 -type f | head -100

      - name: Show MainActivity
        run: |
          echo "===== MAINACTIVITY.KT ====="
          cat buildv14/app/src/main/java/com/example/workcost/MainActivity.kt
          echo "===== END MAINACTIVITY.KT ====="

      - name: Fix Gradle properties
        run: |
          cd buildv14
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
    
      - name: Fix MainActivity.kt
        run: |
          cd buildv14/app/src/main/java/com/example/workcost
          
          # 1. Возвращаем правильное имя переменной в списке формул
          sed -i 's/expression="Q"/expr="Q"/g' MainActivity.kt
          sed -i 's/expression="L x W"/expr="L x W"/g' MainActivity.kt
          sed -i 's/expression="L x W x H"/expr="L x W x H"/g' MainActivity.kt
          sed -i 's/expression="Q x P"/expr="Q x P"/g' MainActivity.kt
          
          # 2. Исправляем ошибки с Modifier (убираем лишние скобки)
          sed -i 's/Modifier\.padding(\([0-9]*\)\.dp){/Modifier.padding(\1.dp)/g' MainActivity.kt
          sed -i 's/Modifier\.padding(\([0-9]*\)\.dp) {/Modifier.padding(\1.dp)/g' MainActivity.kt
          
          # 3. Сохраняем исправленный файл для скачивания
          cp MainActivity.kt $GITHUB_WORKSPACE/MainActivity_fixed.kt
       - name: Build APK
         run: |
          cd buildv14
          gradle --no-daemon :app:assembleDebug

        - name: Upload fixed MainActivity
          uses: actions/upload-artifact@v4
          with:
          name: fixed-MainActivity
          path: MainActivity_fixed.kt
          if-no-files-found: warn

       - name: Upload APK
         uses: actions/upload-artifact@v4
         with:
          name: WorkCostCalculator-debug
          path: buildv14/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
