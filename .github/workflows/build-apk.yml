name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unpack project
        run: |
          unzip -q WorkCostCalculator_Android_v1_4_phone_build_fixed.zip

      - name: Save MainActivity for download
        run: |
          cp buildv14/app/src/main/java/com/example/workcost/MainActivity.kt $GITHUB_WORKSPACE/MainActivity_original.kt

      - name: Upload MainActivity for download
        uses: actions/upload-artifact@v4
        with:
          name: MainActivity-file
          path: MainActivity_original.kt
          if-no-files-found: error

      # Этот шаг всё равно упадет, но он нам и не нужен сейчас
      - name: Build APK (will fail)
        run: |
          cd buildv14
          gradle --no-daemon :app:assembleDebug
